name: label-by-title

on:
  pull_request_target:
    types: [opened, edited, reopened]

permissions: {}

# Two overlapping runs could each read the labels and leave two behind.
concurrency:
  group: label-by-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # release.yml sorts the release notes by label, and the label follows the
  # PR title's conventional-commit type. Only the title is read: no checkout,
  # nothing from the PR runs, which is what makes pull_request_target safe.
  label:
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          # One managed label at a time, so a title edited from feat to fix
          # swaps it. `dependencies` is Dependabot's: added for a runtime
          # bump opened by hand, never removed. A dev bump also gets
          # skip-changelog, and release.yml's exclude wins.
          managed="enhancement bug skip-changelog"
          conventional='^([a-z]+)(\(([^)]*)\))?!?: '
          type=""; scope=""
          if [[ "$TITLE" =~ $conventional ]]; then
            type="${BASH_REMATCH[1]}"; scope="${BASH_REMATCH[3]}"
          fi
          case "$type" in
            feat|perf) wanted=enhancement ;;
            fix) wanted=bug ;;
            ci|test|chore|refactor|style|docs) wanted=skip-changelog ;;
            build) [ "$scope" = deps-dev ] && wanted=skip-changelog || wanted="" ;;
            *) wanted="" ;;
          esac
          current=$(gh pr view "$NUMBER" --repo "$REPO" --json labels --jq '[.labels[].name] | join(" ")')
          args=()
          for label in $managed; do
            case " $current " in *" $label "*) has=1 ;; *) has=0 ;; esac
            if [ "$label" = "$wanted" ] && [ "$has" = 0 ]; then args+=(--add-label "$label"); fi
            if [ "$label" != "$wanted" ] && [ "$has" = 1 ]; then args+=(--remove-label "$label"); fi
          done
          if [ "$type" = build ] && [ "$scope" = deps ]; then
            case " $current " in *" dependencies "*) ;; *) args+=(--add-label dependencies) ;; esac
          fi
          if [ "${#args[@]}" = 0 ]; then
            echo "#$NUMBER '$TITLE': nothing to change (${wanted:-no managed label})"
          else
            gh pr edit "$NUMBER" --repo "$REPO" "${args[@]}"
            echo "#$NUMBER '$TITLE': ${args[*]}"
          fi
