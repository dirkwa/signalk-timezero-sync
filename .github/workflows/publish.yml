# Publishes the tag it runs on to npm through trusted publishing (OIDC), which
# npm binds to this file name. release-please.yml dispatches it on each new
# release tag; a v* tag pushed by hand starts it too.
name: publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

jobs:
  publish:
    # A dispatch can name any ref; only a release tag is published.
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Check the tag matches package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [ "${TAG#v}" != "$(node -p "require('./package.json').version")" ]; then
            echo "::error::Tag '$TAG' does not match package.json"; exit 1
          fi
      - run: npm ci
      - run: npm test
      - run: npm publish
