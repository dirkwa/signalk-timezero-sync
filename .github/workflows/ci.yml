name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # The App Store installs plugins with --ignore-scripts, so nothing may
      # depend on an install script having run.
      - run: npm ci --ignore-scripts
      - run: npm run ci-lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
