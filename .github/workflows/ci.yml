# Signal K's shared plugin CI: tests and build on Linux x64 and arm64, macOS
# and Windows, checks the package the way the App Store installs it, and loads
# the plugin in a real Signal K server. Pinned to a signalk-server commit, so a
# change there reaches this repo only through a PR here.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  plugin-ci:
    uses: SignalK/signalk-server/.github/workflows/plugin-ci.yml@144d4bc8591c3a54465baf6736f4a20e245d057f # master
    with:
      # eslint, prettier and tsc; plugin-ci runs this through eval.
      format-check-command: npm run ci-lint && npm run typecheck
      enable-signalk-integration: true
