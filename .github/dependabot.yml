# Commit prefixes are what release-please reads: a runtime dependency update
# is a fix and makes a release, a dev dependency or CI update does not.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: fix
      prefix-development: chore
      include: scope
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        update-types: [minor, patch]
    ignore:
      # Pinned to a signalk-server master commit; Dependabot would move it to
      # the latest release tag, which can be older. Bump it by hand.
      - dependency-name: SignalK/signalk-server
