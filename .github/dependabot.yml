# Commit prefixes are what the release-please gate and label-by-title read:
# build(deps) is a runtime update and makes a release, build(deps-dev) and ci
# do not.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      prefix-development: build
      include: scope
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # Each major brings the types of a newer Node, and with them APIs the
      # Node versions the plugin supports (engines) may lack. Bump by hand.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
      # TypeScript 7 is the native compiler; typescript-eslint and vitest's
      # typecheck have to support it first. Move to it by hand.
      - dependency-name: typescript
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        update-types: [minor, patch]
    ignore:
      # Pinned to a signalk-server master commit; Dependabot would move it to
      # the latest release tag, which can be older. Bump it by hand.
      - dependency-name: SignalK/signalk-server
